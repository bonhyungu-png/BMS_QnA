services:
  - type: web
    name: bridge-qna
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build && cd .. &&
      cd backend && python -m app.build_db
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BRIDGE_QNA_API_KEY
        sync: false
